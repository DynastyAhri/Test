name: Ruby Windows ARM64

on:
  workflow_dispatch:

jobs:
  install-ruby:
    runs-on: windows-11-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby 4.0 (ARM64)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'

      - name: Verify architecture and version
        run: |
          ruby -v
          ruby -e "puts RbConfig::CONFIG['host_cpu']"

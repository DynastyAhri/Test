name: Check if Runner PHP is Fixed (Ubuntu 24.04)

on:
  workflow_dispatch:

jobs:
  check-runner:
    runs-on: ubuntu-24.04
    steps:
      - name: Verify Runner Pre-installed PHP
        run: |
          # 1. Check if PHP version on runner is >= 8.3.36
          if php -r 'exit(version_compare(PHP_VERSION, "8.3.36", ">=") ? 0 : 1);'; then
            echo "✅ FIXED on runner: PHP $(php -r 'echo PHP_VERSION;') is installed."
            exit 0
          fi

          # 2. Check if Ubuntu backported the fix into the runner's 8.3.6 package
          if zgrep -qE "CVE-2026-109618|CVE-2026-109619" /usr/share/doc/php8.3-common/changelog.Debian.gz 2>/dev/null; then
            echo "✅ FIXED on runner: Ubuntu backported the CVE patch into $(dpkg-query -W -f='${Version}' php8.3-cli)."
            exit 0
          fi

          # 3. Otherwise, the runner image itself is still unpatched
          echo "❌ NOT FIXED on runner: Running $(php -r 'echo PHP_VERSION;') ($(dpkg-query -W -f='${Version}' php8.3-cli 2>/dev/null))."
          exit 1

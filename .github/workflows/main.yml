name: Ruby Windows ARM64 (Manual)

on:
  workflow_dispatch:

jobs:
  install-ruby:
    runs-on: windows-11-arm
    strategy:
      fail-fast: false
      matrix:
        ruby-version:
          - '3.2.11'
          - '3.3.13'
          - '3.4.12'
          - '4.0.9'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby ${{ matrix.ruby-version }} (ARM64)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}

      - name: Verify architecture and version
        run: |
          ruby -v
          ruby -e "puts RbConfig::CONFIG['host_cpu']"

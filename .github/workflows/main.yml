name: Minimal Repro Clang-CL MSVC

on: workflow_dispatch

jobs:
  repro:
    runs-on: windows-latest
    steps:
      - name: Initialize MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Test Atomics compilation with clang-cl
        run: |
          @'
          #include <atomic>
          int main() {
              std::atomic<int> a{0};
              return a.load();
          }
          '@ | Out-File -Encoding utf8 test.cpp

          clang-cl test.cpp

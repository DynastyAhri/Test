name: Tests

on:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-24.04
    env:
      NODE_ENV: test
    services:
      mongo:
        image: mongo:8
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      - run: npm init -y && npm i --package-lock-only vitest
      - run: npm ci
      - run: |
          cat << 'EOF' > sample.test.js
          import { expect, test } from 'vitest';

          test('basic check', () => {
            expect(1 + 1).toBe(2);
          });
          EOF
      - run: npx vitest run

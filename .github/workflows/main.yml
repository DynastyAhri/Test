name: Repro TLS Handshake

on:
  workflow_dispatch:

jobs:
  repro:
    runs-on: ubuntu-26.04
    steps:
      - run: |
          for i in $(seq 1 20); do
            openssl s_client -connect pypi.org:443 -servername pypi.org </dev/null >/dev/null 2>&1 \
              || echo "attempt $i FAILED"
          done

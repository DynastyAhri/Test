name: Verify PHP CVE Patch on Ubuntu 24.04

on:
  workflow_dispatch:

jobs:
  check-php-security:
    runs-on: ubuntu-24.04
    steps:
      - name: Check PHP Security Status
        id: check
        run: |
          # Get base PHP version (e.g., 8.3.6)
          BASE_VER=$(php -r 'echo PHP_VERSION;')

          # Get full Ubuntu package version (e.g., 8.3.6-0ubuntu0.24.04.2)
          PKG_VER=$(dpkg-query -W -f='${Version}\n' php8.3-common 2>/dev/null || echo "Not installed via apt")

          # Search changelog for the CVEs
          if zgrep -qE "CVE-2026-109618|CVE-2026-109619" /usr/share/doc/php8.3-common/changelog.Debian.gz 2>/dev/null; then
            STATUS="✅ PATCHED"
            PATCHED="true"
          else
            STATUS="❌ UNPATCHED (CVEs not found)"
            PATCHED="false"
          fi

          # Print clean output to console
          echo "=========================================="
          echo "PHP Base Version : $BASE_VER"
          echo "Ubuntu Package   : $PKG_VER"
          echo "Security Status  : $STATUS"
          echo "=========================================="

          # Write clean table to GitHub Actions Summary page
          {
            echo "### PHP Security Check (Ubuntu 24.04)"
            echo "| Metric | Value |"
            echo "| :--- | :--- |"
            echo "| **PHP Base Version** | \`$BASE_VER\` |"
            echo "| **Ubuntu Package Revision** | \`$PKG_VER\` |"
            echo "| **Patch Status** | **$STATUS** |"
          } >> "$GITHUB_STEP_SUMMARY"

          # Fail the job if unpatched
          if [ "$PATCHED" = "false" ]; then
            exit 1
          fi

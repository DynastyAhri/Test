name: Build with LLVM 22 on Windows

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install LLVM 22
        shell: pwsh
        run: |
          $version = "22.1.8"
          $installer = "LLVM-$version-win64.exe"
          $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$version/$installer"

          Write-Host "Downloading LLVM $version..."
          Invoke-WebRequest -Uri $url -OutFile $installer

          Write-Host "Installing LLVM silently..."
          Start-Process -FilePath ".\$installer" -ArgumentList "/S" -Wait

          Remove-Item -Path ".\$installer" -Force

          "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify LLVM installation
        shell: pwsh
        run: |
          clang --version
          lld-link --version

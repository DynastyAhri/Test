name: Ruby Windows ARM64 

on:
  workflow_dispatch:

jobs:
  install-ruby:
    runs-on: windows-11-arm

    steps:
      - name: Install Ruby 3.2.11, 3.3.13, 3.4.12, and 4.0.9 (ARM64)
        shell: pwsh
        run: |
          $versions = @('3.2.11', '3.3.13', '3.4.12', '4.0.9')
          $baseDir = "C:\hostedtoolcache\windows\Ruby"

          foreach ($ver in $versions) {
            Write-Host "=== Installing Ruby $ver (ARM64) ===" -ForegroundColor Cyan
            $dest = "$baseDir\$ver\arm64"
            New-Item -ItemType Directory -Force -Path $dest | Out-Null

            $tag = "RubyInstaller-$ver-1"
            $file = "rubyinstaller-$ver-1-arm.7z"
            $url = "https://github.com/oneclick/rubyinstaller2/releases/download/$tag/$file"
            $archive = "$env:TEMP\$file"

            Invoke-WebRequest -Uri $url -OutFile $archive
            7z x $archive "-o$dest" -y | Out-Null
          }

          "$baseDir\4.0.9\arm64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify architecture and version
        shell: pwsh
        run: |
          $versions = @('3.2.11', '3.3.13', '3.4.12', '4.0.9')
          $baseDir = "C:\hostedtoolcache\windows\Ruby"

          foreach ($ver in $versions) {
            $env:PATH = "$baseDir\$ver\arm64\bin;$env:PATH"
            ruby -v
            ruby -e "puts RbConfig::CONFIG['host_cpu']"
          }
